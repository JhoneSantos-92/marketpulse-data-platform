name: marketpulse

services:
  # Mensageria (ADR-0002). Flags baseadas no quickstart oficial do Redpanda.
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.3
    container_name: redpanda
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
    ports:
      - 127.0.0.1:19092:19092   # Kafka API para o código rodando fora do Docker
      - 127.0.0.1:19644:9644    # Admin API e métricas (Prometheus, Fase 7)
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info"]
      interval: 10s
      timeout: 15s
      retries: 10

  # Object storage S3 (ADR-0003). Master, volume, filer e gateway S3 num único processo.
  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    container_name: seaweedfs
    command: server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=8333
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    ports:
      - 127.0.0.1:8333:8333     # API S3
    volumes:
      - seaweedfs-data:/data

  # PostgreSQL para metadados do Airflow (ADR-0006)
  postgres:
    image: postgres:15-alpine
    container_name: airflow_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Apache Airflow com LocalExecutor (ADR-0006)
  airflow:
    image: apache/airflow:2.9.1-python3.12
    container_name: airflow
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__FERNET_KEY=4X9bVzX2J8w1Q3p6Y5t7R0u9W2x1Z4v7
    ports:
      - 127.0.0.1:8080:8080
    volumes:
      - ../orchestration/dags:/opt/airflow/dags
      - ../transformations:/opt/airflow/transformations
      - ../ingestion:/opt/airflow/ingestion
      - ../streaming:/opt/airflow/streaming
    command: bash -c "airflow db migrate && airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@example.com --password admin || true && airflow standalone"

volumes:
  redpanda-data:
  seaweedfs-data:
  postgres-data:
