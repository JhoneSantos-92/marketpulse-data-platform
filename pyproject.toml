[project]
name = "marketpulse-data-platform"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.34.0",
    "confluent-kafka>=2.15.1",
    "deltalake>=0.25.0",
    "google-genai>=0.1.0",
    "httpx>=0.28.1",
    "polars>=1.20.0",
    "pyarrow>=14.0.0",
    "python-dotenv>=1.2.3",
    "websockets>=17.1",
]

[dependency-groups]
dev = [
    "apache-airflow>=2.9.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
